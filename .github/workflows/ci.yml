name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lecture des packs LSP de jjoblab/code-lsp sur GitHub Packages (LOT-11,
# B-02) : les paquets publics exigent quand même un jeton — celui du dépôt
# suffit avec packages: read.
permissions:
  contents: read
  packages: read

jobs:
  controles:
    name: Controles et tests JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Termes interdits
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: ./tools/check-terms.sh
      - name: Langue et dependences
        run: |
          ./tools/check-langue.sh
          ./tools/check-deps.sh
          ./tools/check-cablage-ia.sh
          ./tools/check-cablage-tiroir.sh
      - name: Forge v0.2.28 vers mavenLocal (ADR-001, F-01 livré partie locale)
        run: |
          # Forge publie nativement ses modules bibliothèque depuis v0.2.24
          # (maven-publish embarqué) — plus d'injection par script d'initialisation.
          # v0.2.28 : protocoles 4-6 (console + répertoire du moteur + sous-ensembles,
          # D-21/D-22/D-23) — le traducteur de JoIDE consomme LIFECYCLE, BuildOptions
          # porte consoleLevel, TasksRequest porte les modules.
          git clone --depth 1 --branch v0.2.28 https://github.com/jjoblab/forge.git /tmp/forge
          cd /tmp/forge && ./gradlew --no-daemon publishToMavenLocal
      - name: Tests du coeur JVM (Forge integre, sans SDK Android)
        run: |
          chmod +x gradlew
          JOIDE_SKIP_ANDROID=1 ./gradlew --no-daemon test
      - name: APK debug (plateforme 35, ADR-020)
        env:
          JOIDE_GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # compileSdk 35 (ADR-020) : plateforme stable, visible d'AGP 8.7 —
          # plus de déroulage manuel (la 37 n'était publiée qu'en android-37.0,
          # schéma mineur invisible du résolveur). Les AAR exigeant 36/37.2
          # (céleris, lsp-host) se consomment en copies locales à métadonnées
          # ajustées depuis tools/aar-p35/repo, servi avant les registres
          # distants — la CI n'a plus rien d'exceptionnel à installer.
          sdkmanager "platforms;android-35" >/dev/null
          chmod +x gradlew
          ./gradlew --no-daemon :app-android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: joide-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk

  apk-signe:
    name: APK signe (sur etiquette)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Forge v0.2.28 vers mavenLocal (ADR-001)
        run: |
          git clone --depth 1 --branch v0.2.28 https://github.com/jjoblab/forge.git /tmp/forge
          cd /tmp/forge && ./gradlew --no-daemon publishToMavenLocal
      - name: APK signe (cle stable des secrets)
        env:
          JOIDE_KEYSTORE_B64: ${{ secrets.JOIDE_KEYSTORE_B64 }}
          JOIDE_KEYSTORE_MDP: ${{ secrets.JOIDE_KEYSTORE_MDP }}
          JOIDE_GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keystore reconstitué depuis le secret (base64 PKCS12), puis build
          # release signé (même clé pour toutes les mises à jour).
          echo "$JOIDE_KEYSTORE_B64" | base64 -d > app-android/joide-ci.keystore
          sdkmanager "platforms;android-35" >/dev/null
          chmod +x gradlew
          ./gradlew --no-daemon :app-android:assembleRelease
          rm -f app-android/joide-ci.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: joide-apk-signe
          path: app-android/build/outputs/apk/release/*.apk
