name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  controles:
    name: Controles et tests JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Termes interdits
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: ./tools/check-terms.sh
      - name: Langue et dependences
        run: |
          ./tools/check-langue.sh
          ./tools/check-deps.sh
      - name: Forge vers mavenLocal (ADR-001, demande F-01)
        run: |
          git clone --depth 1 --branch v0.2.6 https://github.com/jjoblab/forge.git /tmp/forge
          ./tools/forge-mavenlocal.sh /tmp/forge 0.2.6
      - name: Tests du coeur JVM (Forge integre, sans SDK Android)
        run: |
          chmod +x gradlew
          JOIDE_SKIP_ANDROID=1 ./gradlew --no-daemon test
      - name: APK debug (SDK de l executant)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app-android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: joide-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk

  apk-signe:
    name: APK signe (sur etiquette)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Forge vers mavenLocal (ADR-001)
        run: |
          git clone --depth 1 --branch v0.2.6 https://github.com/jjoblab/forge.git /tmp/forge
          ./tools/forge-mavenlocal.sh /tmp/forge 0.2.6
      - name: APK signe (cle stable des secrets)
        env:
          JOIDE_KEYSTORE_B64: ${{ secrets.JOIDE_KEYSTORE_B64 }}
          JOIDE_KEYSTORE_MDP: ${{ secrets.JOIDE_KEYSTORE_MDP }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app-android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: joide-apk-signe
          path: app-android/build/outputs/apk/debug/*.apk
