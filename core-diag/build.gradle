// Module JVM pur : constructible et testable sans SDK Android.
// Portage du système de journalisation et de plantage de CodeIDE (core/logging
// + core/crash, ADR-021) : pipeline asynchrone, expurgation à l'écriture,
// stockage JSONL borné avec rotation, rapports de plantage complets (trace,
// filons, appareil), détection de boucle — 100 % Java, zéro dépendance.
plugins { id "java-library" }
group = "jo.joide"
version = "0.1.0"
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 17 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
