// Module application Android : la coquille (écrans, atelier, design system).
// Java 17, vues AndroidX + Material 3, layouts XML + ViewBinding (cahier des charges §3).
// Signature : la CI (job apk-signe) reconstruit le keystore depuis le secret
// JOIDE_KEYSTORE_B64 (base64 PKCS12) et signe le build debug de publication
// (installation cumulative sur appareil : même key, mises à jour autorisées).
plugins {
    id 'com.android.application'
}

android {
    namespace 'jo.joide.app'
    // compileSdk 35 : plateforme supportée nativement par AGP 8.7.3 et installable partout
    // (plus de montage manuel android-37). celeris v2.2.18 et lsp-host 1.15.0 déclarent
    // minCompileSdk 37.2 dans leurs métadonnées AAR : ce contrôle est désactivé plus bas
    // (le code de l'application n'appelle aucune API 36/37) ; targetSdk reste 28 (ADR-009).
    compileSdk 35
    defaultConfig {
        applicationId 'jo.joide.app'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    packaging {
        resources {
            // Les packs LSP embarquent des bibliothèques Kotlin multiplateforme
            // (syntax-api, lang-syntax) : leurs métadonnées de liaison communes
            // se dupliquent — inutiles sur ART, elles partent à l'empaquetage.
            excludes += ['commonMain/**',
                         'META-INF/kotlin-project-structure-metadata.json',
                         'META-INF/com.android.tools/r8/**']
        }
    }
    testOptions {
        // JUnit 5 (LOT-11) : l'intégration réelle des moteurs LSP s'y joue.
        unitTests.all {
            it.useJUnitPlatform()
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        // Clé de debug STABLE, versionnée dans le dépôt (mot de passe public « android »,
        // usage debug uniquement) : même signature sur toutes les machines et toutes
        // les exécutions CI, donc mise à jour par-dessus l'ancienne version sans
        // désinstaller. Ne JAMAIS l'utiliser pour une publication.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Keystore de publication reconstitué par la CI avant le build (jamais versionné).
        ci {
            def keystoreFile = rootProject.file('app-android/joide-ci.keystore')
            storeFile keystoreFile
            storePassword System.getenv('JOIDE_KEYSTORE_MDP')
            keyAlias 'joide'
            keyPassword System.getenv('JOIDE_KEYSTORE_MDP')
            // Le fichier est créé par le job ; s'il est absent, la config reste
            // inutilisée (buildTypes ci-dessous ne l'active que si le fichier existe).
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Job apk-signe (étiquettes) : signature stable depuis les secrets.
            if (rootProject.file('app-android/joide-ci.keystore').exists()
                    && System.getenv('JOIDE_KEYSTORE_MDP') != null) {
                signingConfig signingConfigs.ci
            }
        }
    }
}

dependencies {
    // Brique céleris (consigne du propriétaire, conception §6) : version épinglée
    // v2.2.18, publiée par JitPack (tag git v2.2.18 de jjoblab/celeris).
    // 2.2.11→2.2.18 : la coloration ne paie plus la lexicographie intégrale
    // (ADR-0032), le lexeur TextMate réel (ADR-0030), le cache d'échecs de règles
    // (ADR-0029), la grammaire du premier fichier ne patiente plus (ADR-0028),
    // la complétion survit au lexique périmé (2.2.14).
    implementation 'com.github.jjoblab.celeris:android-view:v2.2.18'
    implementation 'com.github.jjoblab.celeris:android-widgets:v2.2.18'
    implementation 'com.github.jjoblab.celeris:android-host:v2.2.18'
    implementation 'com.github.jjoblab.celeris:core-syntax-grammars:v2.2.18'
    // Brique code-lsp (B-02, LOT-11) : l'hôte LSP officiel — orchestre les
    // moteurs Java/Kotlin/XML v1.15.0 (GitHub Packages de jjoblab/code-lsp,
    // lecture authentifiée par JOIDE_GH_PACKAGES_TOKEN), amène lsp4j 0.22.0,
    // le compagnon ecj-art (EPL-2.0, ~3,2 Mo — B-02 l'avait budgété) et son
    // index CIDX dont l'état nourrit l'écran d'indexation (référence 3.47.0).
    implementation 'jo.codeide.lsp.host:jo-codeide-lsp-host:1.15.0'
    // Le compagnon ecj patché (3,2 Mo, EPL-2.0 — B-02 l'avait budgété) : la
    // brique l'injecte dans SON POM par withXml mais PAS dans les métadonnées
    // Gradle (.module) que Gradle consomme en priorité — la dépendance se
    // déclare ICI (B-05 demandé : rendre le compagnon visible des deux).
    implementation 'jo.codeide.lsp.java:jo-codeide-lsp-java-ecj-art:1.15.0'
    // Coroutines : le constructeur de SessionLsp prend son dispatcheur — la
    // même version que la brique (sinon son scope bifurque).
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation project(':core-lsp')
    implementation project(':core-model')
    implementation project(':core-store')
    implementation project(':workbench-spi')
    implementation project(':build-forge')
    implementation project(':build-gradle-core')
    implementation project(':terminal-core')
    // Indexation à l'ouverture (lot L10) : index consommé par les symboles du tiroir.
    implementation project(':core-index')
    // Écran git (studio HTML) : couche JGit JVM pure, testée.
    implementation project(':core-git')
    // Arborescence du tiroir gauche (Lot 2) : listage borné/annulable,
    // classification fine des types — JVM pur, testé.
    implementation project(':core-files')
    // Liste aplatie de l'arborescence (Lot 3) : recyclage + DiffUtil.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Onglet Chercher (Lot 4) : recherche, remplacement, aller au fichier.
    implementation project(':core-search')
    // Onglet Structure (Lot 5) : plan du fichier actif (Java, XML, MD, JSON).
    implementation project(':core-outline')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Coffre IA : EncryptedSharedPreferences (clé Keystore) — conception §8, REF-123.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Module IA (lot L7) : boucle d'agent + transport + coffre (port).
    implementation project(':ai')
    // Terminal intégré (mode Gradle, ADR-005) : modules Apache-2.0 du dépôt Termux
    // uniquement (terminal-emulator + terminal-view, exception de licence explicite
    // dans LICENSE.md de termux-app). PAS de fork du dépôt racine (GPLv3) et PAS de
    // termux-shared (GPLv3) : le clavier étendu est ré-implémenté en interne.
    implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.3'
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.4'
    implementation 'androidx.navigation:navigation-ui:2.8.4'
    // Tests unitaires (LOT-11) : l'intégration réelle des moteurs LSP sur JVM
    // — le même bytecode que l'appareil (SessionLsp, pont client, classpath Forge).
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Contrôle des métadonnées AAR désactivé : les briques jjoblab (celeris, lsp-host) exigent
// compileSdk 37.2 alors que l'application compile contre l'API 35 (voir plus haut).
tasks.configureEach { t ->
    if (t.name.startsWith('check') && t.name.endsWith('AarMetadata')) {
        t.enabled = false
    }
}
