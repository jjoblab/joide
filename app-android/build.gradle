// Module application Android : la coquille (écrans, atelier, design system).
// Java 17, vues AndroidX + Material 3, layouts XML + ViewBinding (cahier des charges §3).
// Signature : la CI (job apk-signe) reconstruit le keystore depuis le secret
// JOIDE_KEYSTORE_B64 (base64 PKCS12) et signe le build debug de publication
// (installation cumulative sur appareil : même key, mises à jour autorisées).
plugins {
    id 'com.android.application'
}

android {
    namespace 'jo.joide.app'
    compileSdk 36  // celeris AAR (2.2.11) exige 36 ; targetSdk reste 28 (ADR-009)
    defaultConfig {
        applicationId 'jo.joide.app'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        // Keystore reconstitué par la CI avant le build ; absent en local debug
        // (le debug standard garde la clé AOSP de développement).
        ci {
            def keystoreFile = rootProject.file('app-android/joide-ci.keystore')
            storeFile keystoreFile
            storePassword System.getenv('JOIDE_KEYSTORE_MDP')
            keyAlias 'joide'
            keyPassword System.getenv('JOIDE_KEYSTORE_MDP')
            // Le fichier est créé par le job ; s'il est absent, la config reste
            // inutilisée (buildTypes ci-dessous ne l'active que si le fichier existe).
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            // Job apk-signe (étiquettes) : signature stable depuis les secrets.
            if (rootProject.file('app-android/joide-ci.keystore').exists()
                    && System.getenv('JOIDE_KEYSTORE_MDP') != null) {
                signingConfig signingConfigs.ci
            }
        }
    }
}

dependencies {
    // Brique céleris (consigne du propriétaire, conception §6) : version épinglée
    // 2.2.11 via mavenLocal du checkout cloné (ADR-001 bis : pas de tag JitPack —
    // demande B-01). La CI publie celeris vers mavenLocal avant le build.
    // 2.2.11 : la carte des usages sert le document ouvert sans serveur (2e725f4).
    implementation 'jo.celeris:android-view:2.2.11'
    implementation 'jo.celeris:android-widgets:2.2.11'
    implementation 'jo.celeris:android-host:2.2.11'
    implementation 'jo.celeris:core-syntax-grammars:2.2.11'
    implementation project(':core-model')
    implementation project(':core-store')
    implementation project(':workbench-spi')
    implementation project(':build-forge')
    implementation project(':build-gradle-core')
    implementation project(':terminal-core')
    // Écran git (studio HTML) : couche JGit JVM pure, testée.
    implementation project(':core-git')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Coffre IA : EncryptedSharedPreferences (clé Keystore) — conception §8, REF-123.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Module IA (lot L7) : boucle d'agent + transport + coffre (port).
    implementation project(':ai')
    // Terminal intégré (mode Gradle, ADR-005) : modules Apache-2.0 du dépôt Termux
    // uniquement (terminal-emulator + terminal-view, exception de licence explicite
    // dans LICENSE.md de termux-app). PAS de fork du dépôt racine (GPLv3) et PAS de
    // termux-shared (GPLv3) : le clavier étendu est ré-implémenté en interne.
    implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.3'
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.4'
    implementation 'androidx.navigation:navigation-ui:2.8.4'
}
