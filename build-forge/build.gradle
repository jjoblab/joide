// Module JVM pur : constructible et testable sans SDK Android.
// Consomme Forge comme bibliothèque versionnée (ADR-001) : artefacts jo.forge 0.2.28
// publiés sur mavenLocal — publication Maven NATIVE depuis Forge v0.2.24
// (./gradlew publishToMavenLocal dans le dépôt Forge ; tools/forge-mavenlocal.sh
// reste utile aux checkouts plus anciens).
plugins { id "java-library" }
group = "jo.joide"
version = "0.1.0"
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 17 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
dependencies {
    api project(":workbench-spi")
    api project(":core-model")
    api "jo.forge:api:0.2.28"
    api "jo.forge:client:0.2.28"
    api "jo.forge:setup:0.2.28"
    api "jo.forge:json:0.2.28" // analyse des réponses du solr Maven Central (L10)
    testImplementation "jo.forge:engine:0.2.28" // moteur factice (--fake) : intégration JVM
    // Les modèles de création (core-store) sont validés contre le VRAI codec
    // du moteur Forge (ForgeTemplateModelTest) : un modèle qui ne se parserait
    // pas produirait un projet inconstructible (critère L4).
    testImplementation project(":core-store")
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
